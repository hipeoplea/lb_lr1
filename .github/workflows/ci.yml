name: Secure REST API CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run API tests
        run: ./mvnw -B -ntp test

  sast:
    name: SAST — SpotBugs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Analyze Java code
        run: ./mvnw -B -ntp -DskipTests package spotbugs:check
      - name: Save SAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-sast-report
          if-no-files-found: warn
          path: |
            target/reports/spotbugs.html
            target/spotbugsXml.xml

  sca:
    name: SCA — OWASP Dependency-Check
    runs-on: ubuntu-latest
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Check NVD API key
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::error::Add NVD_API_KEY in Settings > Secrets and variables > Actions"
            exit 1
          fi
      - name: Scan dependencies
        run: ./mvnw -B -ntp dependency-check:check
      - name: Save SCA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-sca-report
          if-no-files-found: warn
          path: target/dependency-check-report.html
