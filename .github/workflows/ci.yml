name: Secure REST API CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-scan:
    name: Build, SAST and SCA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and run security scanners
        run: ./gradlew --no-daemon clean test spotbugsMain dependencyCheckAnalyze
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Save scanner reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-reports
          if-no-files-found: warn
          path: |
            build/reports/spotbugs/main.sarif
            build/reports/dependency-check/dependency-check-report.html
