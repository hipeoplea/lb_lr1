spring.application.name=Ib_lr1
spring.datasource.url=jdbc:h2:mem:secure_api;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.h2.console.enabled=false

app.jwt.issuer=http://localhost:8080
app.jwt.secret-base64=${JWT_SECRET_BASE64:}
app.jwt.lifetime-minutes=${JWT_LIFETIME_MINUTES:15}

server.error.include-message=never
server.error.include-stacktrace=never
