spring.application.name=secure-api-lab
spring.datasource.url=jdbc:h2:mem:secure_api;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

app.jwt.issuer=secure-api-lab
app.jwt.secret-base64=${JWT_SECRET_BASE64:}

spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
